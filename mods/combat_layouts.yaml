LAYOUT_GROUPS:
  1_PLAYER:
    - LEFT_COMBAT
  2_PLAYERS:
    - LEFT_COMBAT
    - RIGHT_COMBAT
  3_PLAYERS:
    - LEFT_COMBAT
    - CENTER_COMBAT
    - RIGHT_COMBAT

LAYOUT_COORDINATES:
  LEFT_COMBAT:
    # Position where the monster appears on the left side of the battlefield
    home: [0, 124, 192, 140]
    # Position for the first monster in a 2 vs 2 setup (left side)
    home0: [30, 124, 192, 140] # [+30 px right vs home]
    # Position for the second monster in a 2 vs 2 setup (left side)
    home1: [-30, 124, 192, 140] # [-30 px left vs home]
    # Position of the HUD showing name, level, etc. (left side)
    hud: [290, 90, 220, 100] # fixed HUD for single monster
    # HUD position for the first monster in a 2 vs 2 setup
    hud0: [290, 50, 220, 100] # shifted upward for first HUD
    monster_status_icon_slot_0: [328, 122, 18, 18] # status icon aligned with hud0
    # HUD position for the second monster in a 2 vs 2 setup
    hud1: [290, 90, 220, 100] # same as hud (fallback for 2nd monster)
    monster_status_icon_slot_1: [328, 162, 18, 18] # status icon aligned with hud
    # Tuxeball icon strip (left side, shows number of available monsters)
    party: [290, 114, 220, 100] # placed just below the HUD region
    # Monster box image position for single monster
    monster_box_home: [96, 216, 4, 4] # [+94 px right, +92 px below vs home]
    # Monster box image for first monster in a 2 vs 2 setup
    monster_box_home0: [124, 216, 4, 4] # [+30 px right vs monster_box_home]
    # Monster box image for second monster in a 2 vs 2 setup
    monster_box_home1: [64, 216, 4, 4] # [-30 px left vs monster_box_home]
    # These positions define where HUD text lines are drawn.
    # The values are in [x, y, width, height] format, but width/height are unused and set to 1.
    # Line 1 usually shows monster name, gender icon, and level.
    # Line 2 typically shows HP bar or additional status info.
    hud_line1: [24, 22, 2, 2]  # top line: monster, lv, etc.
    hud_line2: [24, 38, 2, 2]  # second line: position hp_bar


  RIGHT_COMBAT:
    home: [280, 36, 192, 140]
    home0: [250, 36, 192, 140]
    home1: [310, 36, 192, 140]
    hud: [36, 0, 170, 60]
    hud0: [36, 0, 170, 60]
    monster_status_icon_slot_0: [30, 34, 18, 18]
    hud1: [36, 40, 170, 60]
    monster_status_icon_slot_1: [30, 74, 18, 18]
    party: [36, 24, 170, 60]
    monster_box_home: [376, 128, 4, 4]
    monster_box_home0: [344, 128, 4, 4]
    monster_box_home1: [404, 128, 4, 4]
    hud_line1: [10, 10, 2, 2]
    hud_line2: [10, 26, 2, 2]

  CENTER_COMBAT:
    home: [140, 80, 192, 140]
    home0: [170, 80, 192, 140]
    home1: [110, 80, 192, 140]
    hud: [160, 40, 220, 100]
    hud0: [160, 10, 220, 100]
    monster_status_icon_slot_0: [198, 82, 18, 18]
    hud1: [160, 70, 220, 100]
    monster_status_icon_slot_1: [198, 142, 18, 18]
    party: [160, 100, 220, 100]
    monster_box_home: [234, 172, 2, 2]
    monster_box_home0: [204, 172, 2, 2]
    monster_box_home1: [264, 172, 2, 2]
    hud_line1: [10, 22, 2, 2]
    hud_line2: [10, 38, 2, 2]
